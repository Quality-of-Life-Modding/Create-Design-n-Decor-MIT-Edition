name: Automatically build to and publish to HitHub.
# This action is triggered when a GitHub release is created/published
# The release title is used as version name
# The release tag is used as the version number
# The release description is used as the changelog
on:
  workflow_dispatch:
  release:
    types: [ published ]


env:
  JAVA_VERSION: 17
  # use only single mod loader, it is appended to the version
  MOD_LOADER: forge
  # Filled from gradle.properties in the build job
  GAME_VERSIONS: ""
  GAME_VERSION_FILTER: releases
  VERSION_TYPE: release
  PRIMARY_FILE_GLOB: "*.jar"


jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    environment: github-actions
    permissions:
      contents: write
    outputs:
      mod_version: ${{ steps.release_meta.outputs.mod_version }}
      mc_version: ${{ steps.release_meta.outputs.mc_version }}
      game_versions: ${{ steps.release_meta.outputs.game_versions }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set execution permissions for Gradle wrapper
        run: chmod +x gradlew

      - name: Read release metadata from gradle.properties
        id: release_meta
        shell: bash
        run: |
          mod_version=$(grep -E '^mod_version\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          minecraft_version=$(grep -E '^(mc_version|minecraft_version)\s*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)

          if [[ -z "$mod_version" ]]; then
            echo "ERROR: mod_version is missing from gradle.properties" >&2
            exit 1
          fi

          if [[ -z "$minecraft_version" ]]; then
            echo "ERROR: mc_version/minecraft_version is missing from gradle.properties" >&2
            exit 1
          fi

          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"
          echo "MC_VERSION=$minecraft_version" >> "$GITHUB_ENV"
          echo "GAME_VERSIONS=[$minecraft_version]" >> "$GITHUB_ENV"

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "mc_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "game_versions=[$minecraft_version]" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches mod_version
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag=${GITHUB_REF#refs/tags/}
          tag=${tag#v}

          if [[ "$tag" != "$MOD_VERSION" ]]; then
            echo "ERROR: Release tag '$tag' does not match mod_version '$MOD_VERSION' from gradle.properties" >&2
            exit 1
          fi

      - name: Build Release
        run: ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/${{ env.PRIMARY_FILE_GLOB }}

  publish-to-github:
    name: Attach JAR to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: github-actions
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: artifacts

      - name: Publish to GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-prerelease: false
          files: artifacts/${{ env.PRIMARY_FILE_GLOB }}
          version-type: ${{ env.VERSION_TYPE }}
          loaders: ${{ env.MOD_LOADER }}
          game-versions: ${{ needs.build.outputs.game_versions }}
          game-version-filter: ${{ env.GAME_VERSION_FILTER }}
          java: ${{ env.JAVA_VERSION }}
